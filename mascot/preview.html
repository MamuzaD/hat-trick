<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hat Trick mascot</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 14px/1.4 system-ui, sans-serif; background: #ffffff; color: #1b1f27; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #555; }
  .panel { border-radius: 12px; padding: 20px; margin-bottom: 20px; overflow-x: auto; }
  .light { background: #f3f1ec; color: #1b1f27; }
  .dark { background: #1b1f27; color: #e8eaf0; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 16px; opacity: .7; }
  table { border-collapse: collapse; }
  th, td { padding: 8px 16px; text-align: center; vertical-align: middle; }
  th { font-weight: 600; font-size: 13px; }
  td.size { text-align: right; font-size: 12px; opacity: .7; white-space: nowrap; }
  img { display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<h1>Hat Trick mascot</h1>
<p>Four expressions, identical body. Each SVG is a 24x24 pixel grid.</p>

<section class="panel light">
  <h2>Light background</h2>
  <table>
    <tr><th></th><th>idle</th><th>thinking</th><th>smug</th><th>defensive</th></tr>
    <tr><td class="size">32px</td>
      <td><img src="hat-idle.svg" width="32" height="32" alt="idle"></td>
      <td><img src="hat-thinking.svg" width="32" height="32" alt="thinking"></td>
      <td><img src="hat-smug.svg" width="32" height="32" alt="smug"></td>
      <td><img src="hat-defensive.svg" width="32" height="32" alt="defensive"></td></tr>
    <tr><td class="size">64px</td>
      <td><img src="hat-idle.svg" width="64" height="64" alt="idle"></td>
      <td><img src="hat-thinking.svg" width="64" height="64" alt="thinking"></td>
      <td><img src="hat-smug.svg" width="64" height="64" alt="smug"></td>
      <td><img src="hat-defensive.svg" width="64" height="64" alt="defensive"></td></tr>
    <tr><td class="size">200px</td>
      <td><img src="hat-idle.svg" width="200" height="200" alt="idle"></td>
      <td><img src="hat-thinking.svg" width="200" height="200" alt="thinking"></td>
      <td><img src="hat-smug.svg" width="200" height="200" alt="smug"></td>
      <td><img src="hat-defensive.svg" width="200" height="200" alt="defensive"></td></tr>
  </table>
</section>

<section class="panel dark">
  <h2>Dark background</h2>
  <table>
    <tr><th></th><th>idle</th><th>thinking</th><th>smug</th><th>defensive</th></tr>
    <tr><td class="size">32px</td>
      <td><img src="hat-idle.svg" width="32" height="32" alt="idle"></td>
      <td><img src="hat-thinking.svg" width="32" height="32" alt="thinking"></td>
      <td><img src="hat-smug.svg" width="32" height="32" alt="smug"></td>
      <td><img src="hat-defensive.svg" width="32" height="32" alt="defensive"></td></tr>
    <tr><td class="size">64px</td>
      <td><img src="hat-idle.svg" width="64" height="64" alt="idle"></td>
      <td><img src="hat-thinking.svg" width="64" height="64" alt="thinking"></td>
      <td><img src="hat-smug.svg" width="64" height="64" alt="smug"></td>
      <td><img src="hat-defensive.svg" width="64" height="64" alt="defensive"></td></tr>
    <tr><td class="size">200px</td>
      <td><img src="hat-idle.svg" width="200" height="200" alt="idle"></td>
      <td><img src="hat-thinking.svg" width="200" height="200" alt="thinking"></td>
      <td><img src="hat-smug.svg" width="200" height="200" alt="smug"></td>
      <td><img src="hat-defensive.svg" width="200" height="200" alt="defensive"></td></tr>
  </table>
</section>
</body>
</html>
